preprocessing:
  _: |
    Extract industrial network topology facts from the JSON configuration.
    STRICT RULES:
    1. Only lowercase letters, digits, and underscores.
    2. Convert 'vjumpserver' to 'jump_server'.
    3. Output valid Datalog facts. If a host has no services/CVEs, do NOT invent them.

  located(host, zone, ipSubnet): |
    Read the 'hosts' array. For each host, extract its 'id' and 'zone'.
    Example: [OUTPUT]located(jump_server, ot_dmz, ipSubnet).[/OUTPUT]

  networkService(host, service, protocol, port, privilege): |
    Read 'software_services' inside each host in 'hosts'.
    Example: [OUTPUT]networkService(jump_server, sshd, tcp, 22, admin).[/OUTPUT]
    Example: [OUTPUT]networkService(plc_l1_1, modbus_service, tcp, 502, root).[/OUTPUT]

  hasAccount(host, username, password_key): |
    Read 'credentials' inside each host in 'hosts'.
    Example: [OUTPUT]hasAccount(jump_server, admin, automation_pass_1969).[/OUTPUT]

  aclNW(source, destination, protocol, port): |
    Read 'firewall_rules'. For each rule extract source, destination, protocol, and port.
    Example: [OUTPUT]aclNW(internet, jump_server, tcp, 22).[/OUTPUT]
    Example: [OUTPUT]aclNW(jump_server, plc_l1_1, tcp, 502).[/OUTPUT]

  vulHost(host, cve_id, service, remoteExploit, privEscalation): |
    Read 'software_services' in 'hosts'. If an item has 'cve', extract it.
    Example: [OUTPUT]vulHost(jump_server, cve_2023_38408, sshd, remoteExploit, privEscalation).[/OUTPUT]
    Example: [OUTPUT]vulHost(plc_l1_1, cve_2022_25888, opcua_server, remoteExploit, dos).[/OUTPUT]

  l2Connection(source, destination, bus_id, protocol, bus): |
    Read 'fieldbus_connections'. Extract source, destination, bus_id, protocol, and type.
    Example: [OUTPUT]l2Connection(jump_server, drive_area_1_1, bus_area_1, profinet, bus).[/OUTPUT]

knowledge_base: |
  sameCredentials(H1, H2) :- hasAccount(H1, U, P), hasAccount(H2, U, P), H1 != H2.
  isDomainController(H, danieli_domain) :- networkService(H, active_directory, _, _, _).
  vulLinkProtocol(H, vul_modbus_no_auth, modbus, adjacent, impersonateDst) :- networkService(H, modbus_service, tcp, 502, _).
  isMaster(H, bus_area_1) :- networkService(H, modbus_service, tcp, 502, _).
  isSlave(D, bus_area_1) :- located(D, fieldbus_l0, _).